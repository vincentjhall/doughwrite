<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doughwrite</title><style>body{font-family:Arial,sans-serif;background:#f8f0e7;color:#2d170d;margin:0}main{max-width:760px;margin:auto;padding:16px}h1{font:700 3rem Georgia;color:#73391d;margin:0}h1 span{color:#e56d18}h2{font-family:Georgia;color:#73391d}.tabs,.grid,.stats{display:grid;gap:10px}.tabs,.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}button,input,select{box-sizing:border-box;width:100%;min-height:40px;border-radius:8px;font:inherit;padding:8px}button{border:0;background:#e56d18;color:#fff;font-weight:bold}.tab{background:#fff;color:#73391d;border:1px solid #dfc2aa}.tab.active{background:#e56d18;color:white}.card{background:#fffaf3;border:1px solid #dfc2aa;border-radius:12px;padding:14px;margin-top:12px}label{font-weight:bold;font-size:.82rem;color:#73391d}.stat{background:#fff5ea;border:1px solid #dfc2aa;border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:1.5rem;color:#e56d18}.stat small{color:#76655a}table{width:100%;border-collapse:collapse}th,td{padding:9px 2px;border-bottom:1px solid #dfc2aa;text-align:left}.notice{background:#fff4e7;border-left:4px solid #e56d18;padding:10px;margin-top:10px}.hidden{display:none}@media(max-width:440px){.grid,.tabs,.stats{grid-template-columns:1fr}}</style></head><body><main><h1>Dough<span>write</span></h1><p>Pizza, bread, sourdough, poolish, and biga formulas.</p><div class="tabs"><button class="tab active" id="pizzaTab">Pizza dough</button><button class="tab" id="breadTab">Bread & starters</button></div><div class="card"><h2 id="title">Pizza formula</h2><div class="grid"><label id="styleText">Pizza style<select id="style"></select></label><label id="countText">Pizzas<input id="count" type="number" min="1"></label><label id="sizeText">Diameter (in)<input id="size" type="number" min="1"></label><label id="thicknessText">Thickness factor<input id="thickness" type="number" step=".0025"></label><label>Hydration %<input id="hydration" type="number" step=".5"></label><label>Salt %<input id="salt" type="number" step=".1"></label><label>Oil %<input id="oil" type="number" step=".1"></label><label>Flour<select id="flour"><option>Bread Flour</option><option>00 Pizza Flour</option><option>All-purpose Flour</option></select></label></div></div><div class="card"><h2>Starter or yeast</h2><div class="grid"><label>Leaven<select id="leaven"><option value="yeast">Commercial yeast</option><option value="sourdough">Sourdough starter</option><option value="poolish">Poolish</option><option value="biga">Biga</option></select></label><label>Prefermented flour %<input id="starterPct" type="number"></label><label>Starter hydration %<input id="starterHyd" type="number"></label><label>Instant dry yeast %<input id="yeast" type="number" step=".01"></label><label>Starter maturity hours<input id="starterHours" type="number"></label><label>Bulk fermentation hours<input id="bulk" type="number" step=".5"></label><label>Cold proof hours<input id="cold" type="number"></label><label>Oven °F<input id="oven" type="number"></label><label>Bake minutes<input id="bake" type="number"></label></div></div><div class="card"><h2>Formula results</h2><div class="stats"><div class="stat"><b id="doughOut">—</b><small>Total dough</small></div><div class="stat"><b id="flourOut">—</b><small>Total flour</small></div><div class="stat"><b id="unitOut">—</b><small id="unitLabel">Per pizza</small></div></div></div><div class="card"><h2>Ingredients</h2><table><thead><tr><th>Ingredient</th><th>Amount</th></tr></thead><tbody id="ingredients"></tbody></table><div class="notice" id="starterOut"></div></div><div class="card"><h2>Timeline</h2><div class="notice" id="timeline"></div></div><div class="card"><h2>Method</h2><div id="method"></div></div></main><script>
(function(){const $=id=>document.getElementById(id);let mode='pizza';const pizza={"New York":{count:3,size:15,thickness:.0625,hydration:68,salt:2,oil:2,flour:'Bread Flour',leaven:'poolish',starterPct:10,starterHyd:100,yeast:.1,starterHours:14,bulk:2,cold:24,oven:750,bake:3},Neapolitan:{count:3,size:12,thickness:.06,hydration:65,salt:2.8,oil:0,flour:'00 Pizza Flour',leaven:'yeast',starterPct:0,starterHyd:100,yeast:.06,starterHours:0,bulk:2,cold:18,oven:850,bake:2},Sicilian:{count:2,size:14,thickness:.1,hydration:75,salt:2.2,oil:5,flour:'Bread Flour',leaven:'poolish',starterPct:20,starterHyd:100,yeast:.1,starterHours:12,bulk:3,cold:12,oven:550,bake:18}};const bread={"Country Sourdough":{count:1,size:850,thickness:0,hydration:75,salt:2,oil:0,flour:'Bread Flour',leaven:'sourdough',starterPct:20,starterHyd:100,yeast:.1,starterHours:8,bulk:4,cold:14,oven:475,bake:40},"Sandwich Loaf":{count:1,size:900,thickness:0,hydration:68,salt:2,oil:5,flour:'Bread Flour',leaven:'yeast',starterPct:0,starterHyd:100,yeast:.6,starterHours:0,bulk:2,cold:0,oven:375,bake:35},Focaccia:{count:1,size:1000,thickness:0,hydration:80,salt:2.5,oil:7,flour:'Bread Flour',leaven:'poolish',starterPct:30,starterHyd:100,yeast:.1,starterHours:12,bulk:3,cold:12,oven:450,bake:25},Bagels:{count:8,size:120,thickness:0,hydration:55,salt:2,oil:0,flour:'Bread Flour',leaven:'yeast',starterPct:0,starterHyd:100,yeast:.6,starterHours:0,bulk:1.5,cold:12,oven:425,bake:20},Baguettes:{count:3,size:280,thickness:0,hydration:70,salt:2,oil:0,flour:'Bread Flour',leaven:'poolish',starterPct:30,starterHyd:100,yeast:.08,starterHours:12,bulk:3,cold:12,oven:475,bake:24}};const fields=['count','size','thickness','hydration','salt','oil','flour','leaven','starterPct','starterHyd','yeast','starterHours','bulk','cold','oven','bake'];function num(id,fallback){const x=Number($(id).value);return Number.isFinite(x)?x:fallback}function grams(x){return x.toFixed(1)+'g'}function active(){return mode==='pizza'?pizza:bread}function put(p){fields.forEach(k=>{$(k).value=p[k]});calculate()}function loadStyles(){const a=active();$('style').innerHTML='';Object.keys(a).forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;$('style').appendChild(o)});put(a[$('style').value])}function setMode(next){mode=next;$('pizzaTab').classList.toggle('active',next==='pizza');$('breadTab').classList.toggle('active',next==='bread');const b=next==='bread';$('title').textContent=b?'Bread formula':'Pizza formula';$('styleText').childNodes[0].nodeValue=b?'Bread style':'Pizza style';$('countText').childNodes[0].nodeValue=b?'Loaves':'Pizzas';$('sizeText').childNodes[0].nodeValue=b?'Dough per loaf (g)':'Diameter (in)';$('thicknessText').classList.toggle('hidden',b);$('unitLabel').textContent=b?'Per loaf':'Per pizza';loadStyles()}function calculate(){const count=Math.max(1,num('count',1));const hyd=num('hydration',70)/100;const saltP=num('salt',2)/100;const oilP=num('oil',0)/100;let total;if(mode==='pizza'){const diameter=num('size',12);const thickness=num('thickness',.06);total=Math.max(150,Math.PI*(diameter/2)*(diameter/2)*thickness*37)*count}else total=Math.max(100,num('size',850))*count;const flour=total/(1+hyd+saltP+oilP);const water=flour*hyd;const salt=flour*saltP;const oil=flour*oilP;const leaven=$('leaven').value;const hasStarter=leaven!=='yeast';const starterFlour=hasStarter?flour*num('starterPct',0)/100:0;const starterWater=starterFlour*num('starterHyd',100)/100;const finalFlour=flour-starterFlour;const finalWater=water-starterWater;$('doughOut').textContent=Math.round(total)+'g';$('flourOut').textContent=Math.round(flour)+'g';$('unitOut').textContent=Math.round(total/count)+'g';const ingredients=[[ $('flour').value,flour],['Water',water],['Salt',salt],['Oil',oil]];if(!hasStarter)ingredients.push(['Instant dry yeast',flour*num('yeast',0)/100]);$('ingredients').innerHTML=ingredients.map(r=>'<tr><td>'+r[0]+'</td><td>'+grams(r[1])+'</td></tr>').join('');$('starterOut').innerHTML=hasStarter?'<strong>'+leaven+'</strong>: build with '+grams(starterFlour)+' flour + '+grams(starterWater)+' water. Final mix: '+grams(finalFlour)+' flour + '+grams(finalWater)+' water + '+grams(salt)+' salt.':'<strong>Direct dough:</strong> mix all ingredients together.';const build=hasStarter?num('starterHours',0):0;$('timeline').innerHTML='<strong>Build:</strong> '+(hasStarter?build+' hr '+leaven:'none')+'<br><strong>Bulk:</strong> '+num('bulk',0)+' hr<br><strong>Cold proof:</strong> '+num('cold',0)+' hr<br><strong>Bake:</strong> '+num('bake',0)+' min at '+num('oven',0)+'°F';const unit=mode==='pizza'?'pizza balls':'loaves';const steps=[hasStarter?'Build the '+leaven+' for '+build+' hours.':'Mix all ingredients until no dry flour remains.','Mix final dough: '+grams(finalFlour)+' flour, '+grams(finalWater)+' water, '+grams(salt)+' salt, '+grams(oil)+' oil.','Bulk ferment for '+num('bulk',0)+' hours.','Shape '+count+' '+unit+' at about '+Math.round(total/count)+'g each.',num('cold',0)>0?'Cold proof for '+num('cold',0)+' hours.':'Proof at room temperature until ready.','Bake at '+num('oven',0)+'°F for '+num('bake',0)+' minutes.'];$('method').innerHTML=steps.map((s,i)=>'<p><strong>'+(i+1)+'.</strong> '+s+'</p>').join('')}$('pizzaTab').onclick=()=>setMode('pizza');$('breadTab').onclick=()=>setMode('bread');$('style').onchange=()=>put(active()[$('style').value]);fields.forEach(id=>$(id).addEventListener('input',calculate));setMode('pizza')})();
</script></body></html>
